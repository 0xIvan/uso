name: Build checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate scripts and metadata
        run: |
          bash -n tools/build.sh tools/package.sh tools/install.sh tools/uninstall.sh
          plutil -lint Info.plist
          git diff --check
      - name: Build universal app and run self-checks
        run: |
          tools/build.sh
          tmp/Uso.app/Contents/MacOS/Uso --self-check
          for arch in arm64 x86_64; do
            xcrun lipo tmp/Uso.app/Contents/MacOS/Uso -verify_arch "$arch"
          done
