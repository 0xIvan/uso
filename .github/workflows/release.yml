name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CODE_SIGN_IDENTITY: 'Developer ID Application: Ivan Hu Yu (AB879DAVK8)'
      NOTARY_PROFILE: uso-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and existing release
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag must match Info.plist version.' >&2; exit 1; }
          git merge-base --is-ancestor HEAD origin/main
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json"; then
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Refusing to overwrite a published release.")' "$RUNNER_TEMP/existing-release.json"
          fi
      - name: Configure signing and notarization
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done
          umask 077
          keychain="$RUNNER_TEMP/uso-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/uso-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/uso-signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          curl --fail --silent --show-error --location https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
      - name: Build, notarize, and verify DMG
        run: tools/package.sh --release
      - name: Generate signed Sparkle feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo 'Missing GitHub secret: SPARKLE_PRIVATE_KEY' >&2; exit 1; }
          tools/appcast.sh
      - name: Create draft release and attach downloads
        run: |
          version=${RELEASE_TAG#v}
          if ! gh release view "$RELEASE_TAG" --json id > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Uso $version" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "dist/Uso-$version-universal.dmg" "dist/Uso-$version-universal.dmg.sha256" dist/appcast.xml --clobber
      - name: Remove signing material
        if: always()
        run: |
          keychain="$RUNNER_TEMP/uso-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/uso-signing.p12"
