name: MacMirrorly release packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.repository == '0xIvan/uso' && github.ref == 'refs/heads/macmirrorly-release-1.0.8'
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CODE_SIGN_IDENTITY: 'Developer ID Application: Ivan Hu Yu (AB879DAVK8)'
      NOTARY_PROFILE: macmirrorly-release
      MAC_MIRRORLY_DEVELOPER_ID: 'Developer ID Application: Ivan Hu Yu (AB879DAVK8)'
      MAC_MIRRORLY_NOTARY_PROFILE: macmirrorly-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: 0xIvan/mac-mirrorly
          ref: 480f0f582079663a24aaf07bd581040e1ba5cc6d
          persist-credentials: false
      - name: Validate pinned release source
        run: |
          test "$(git rev-parse HEAD)" = 480f0f582079663a24aaf07bd581040e1ba5cc6d
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)" = 1.0.8
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)" = 9
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Build and test release source
        run: |
          xcodegen generate
          xcodebuild test -project MacMirrorly.xcodeproj -scheme MacMirrorly -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet
      - name: Configure signing and notarization
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done
          umask 077
          keychain="$RUNNER_TEMP/uso-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/uso-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/uso-signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          curl --fail --silent --show-error --location https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
      - name: Build, notarize, and verify MacMirrorly
        run: |
          xcrun() {
            if [[ "$1" != stapler || "$2" != staple ]]; then
              /usr/bin/xcrun "$@"
              return $?
            fi
            local attempt status
            for attempt in 1 2 3 4 5; do
              if /usr/bin/xcrun "$@"; then return 0; else status=$?; fi
              if [[ "$status" != 68 || "$attempt" == 5 ]]; then return "$status"; fi
              echo "Apple ticket delivery failed (68); retry $attempt/5 in 10 seconds."
              sleep 10
            done
          }
          export -f xcrun
          scripts/release-dmg.sh
      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.MACMIRRORLY_SPARKLE_PRIVATE_KEY }}
        run: scripts/appcast.sh
      - name: Save verified release downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MacMirrorly-1.0.8-notarized
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/MacMirrorly-1.0.8-universal.dmg
            dist/MacMirrorly-1.0.8-universal.dmg.sha256
            dist/appcast.xml
      - name: Remove signing material
        if: always()
        run: |
          keychain="$RUNNER_TEMP/uso-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/uso-signing.p12"
