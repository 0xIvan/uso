name: Hago release candidate packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.repository == '0xIvan/uso' && github.ref == 'refs/heads/hago-package-0.2.0-42e38c768b'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAGO_CODE_SIGN_IDENTITY: 'Developer ID Application: Ivan Hu Yu (AB879DAVK8)'
      HAGO_NOTARY_PROFILE: hago-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: 0xIvan/hago
          ref: 42e38c768bffe4a3ed8a336be2fff43701589150
          persist-credentials: false
      - name: Validate exact source
        run: |
          test "$(git rev-parse HEAD)" = 42e38c768bffe4a3ed8a336be2fff43701589150
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' Resources/Info.plist)" = com.ivan.hago
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)" = 0.2.0
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Resources/Info.plist)" = 2
      - name: Test and package
        run: |
          swift test
          scripts/package-app.sh release
      - name: Configure ephemeral signing and notarization
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing signing secret: $name" >&2; exit 1; }
          done
          umask 077
          signing_keychain="$RUNNER_TEMP/hago-signing.keychain-db"
          signing_password=$(openssl rand -hex 32)
          echo "::add-mask::$signing_password"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/hago-signing.p12"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$RUNNER_TEMP/hago-signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$signing_keychain" -T /usr/bin/codesign
          curl --fail --silent --show-error --location https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$signing_keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$signing_password" "$signing_keychain" > /dev/null
          security list-keychains -d user -s "$signing_keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$HAGO_NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
      - name: Sign notarize and verify app and DMG
        run: |
          scripts/notarize-app.sh outputs/Hago.app outputs/notarization.zip
          scripts/package-dmg.sh outputs/Hago.app outputs
          candidate_dmg="$(find outputs -maxdepth 1 -name 'Hago-*.dmg' -print -quit)"
          xcrun notarytool submit "$candidate_dmg" --keychain-profile "$HAGO_NOTARY_PROFILE" --wait --output-format json > outputs/dmg-notarization.json
          python3 -c 'import json; assert json.load(open("outputs/dmg-notarization.json"))["status"] == "Accepted"'
          xcrun stapler staple "$candidate_dmg"
          xcrun stapler validate "$candidate_dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$candidate_dmg"
          hdiutil verify "$candidate_dmg"
          (cd outputs && shasum -a 256 Hago-*.dmg Hago-*.zip > SHA256SUMS)
      - name: Save notarized candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hago-0.2.0-notarized-arm64
          retention-days: 7
          if-no-files-found: error
          path: |
            outputs/Hago-*.dmg
            outputs/Hago-*.zip
            outputs/SHA256SUMS
            outputs/dmg-notarization.json
      - name: Clean ephemeral signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/hago-signing.keychain-db" || true
          python3 -c 'import os; p=os.environ["RUNNER_TEMP"]+"/hago-signing.p12"; os.path.exists(p) and os.remove(p)'
